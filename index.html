<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB World Series History</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1>World Series History</h1>
    <p class="subtitle">Every champion, every game score, every MVP &mdash; 1903 to today</p>
  </div>
</header>

<nav class="controls">
  <div class="controls-inner">
    <input type="search" id="searchInput" placeholder="Search by team, year, or MVP&hellip;" aria-label="Search">
    <div class="era-filter" id="eraFilter" role="tablist" aria-label="Filter by era"></div>
  </div>
</nav>

<main>
  <div id="timeline" class="timeline"></div>
  <p id="emptyState" class="empty-state" hidden>No World Series match your search.</p>
</main>

<div id="detailOverlay" class="detail-overlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="detail-close" id="detailClose" aria-label="Close">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<footer class="site-footer">
  <p>A static reference of MLB World Series results, game scores, and Most Valuable Player winners.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
